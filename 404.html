<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#131209" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Página não encontrada | Isaias Rodrigues</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100svh; margin: 0; padding: 24px; place-items: center; background: #131209; color: #f8f6ef; font-family: "Manrope", sans-serif; }
      main { width: min(100%, 32rem); text-align: center; }
      span { display: block; color: #d9ff5b; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.16em; }
      h1 { margin: 16px 0; font-size: 4.5rem; font-weight: 500; line-height: 1; letter-spacing: -0.06em; text-wrap: balance; }
      p { margin: 0 auto 32px; color: rgba(248, 246, 239, 0.68); line-height: 1.5; text-wrap: pretty; }
      a { display: inline-flex; padding: 8px 12px; border-radius: 8px; background: #d9ff5b; color: #131209; font-size: 1rem; font-weight: 600; text-decoration: none; transition: transform 700ms cubic-bezier(0.32, 0.72, 0, 1); }
      a:hover { transform: translateY(-2px); }
      a:active { transform: scale(0.98); }
      a:focus-visible { outline: 2px solid #f8f6ef; outline-offset: 4px; }
      @media (max-width: 600px) { h1 { font-size: 3rem; } }
    </style>
  </head>
  <body>
    <main>
      <span>ERRO 404</span>
      <h1>Este link não está por aqui.</h1>
      <p>O endereço pode ter mudado. Volte ao perfil para encontrar todas as redes disponíveis.</p>
      <a href="/">Voltar ao perfil</a>
    </main>
  </body>
</html>
